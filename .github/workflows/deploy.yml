name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  # A literal, not a secret. As a secret, forgetting to set it made the rsync
  # destination "host:/" — the filesystem root, which --delete then tried to
  # empty. The path is not sensitive; a literal removes that failure mode.
  DEPLOY_PATH: /var/www/thelearningcraft.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This project reads no import.meta.env values, so the build needs no
      # secrets. Add them here if that changes.
      - run: npm run build

      - name: Validate deploy target
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          fail=0
          for v in SSH_HOST SSH_USER SSH_PORT; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not set"; fail=1; fi
          done
          case "$DEPLOY_PATH" in
            /var/www/?*) ;;
            *) echo "::error::DEPLOY_PATH must be a path under /var/www, got '$DEPLOY_PATH'"; fail=1;;
          esac
          [ -d dist ] && [ -f dist/index.html ] || { echo "::error::dist/ missing or has no index.html"; fail=1; }
          exit $fail

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Rsync dist to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "test -d '$DEPLOY_PATH'" \
            || { echo "::error::$DEPLOY_PATH does not exist on the server"; exit 1; }

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
